{% extends "base.html" %}
{% block title %}Admin Login - Pharmacy Medicine Ordering System{% endblock %}
{% block content %}
<section class="section form-section">
    <h1>Admin Login</h1>
    <p class="muted">Restricted area. Admin access only.</p>
    <form method="post" action="{{ url_for('admin_login') }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username|default('') }}" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn">Login as Admin</button>
    </form>
    <p><a href="{{ url_for('login') }}">Customer login</a> &middot; <a href="{{ url_for('home') }}">Back to home</a></p>
</section>
{% endblock %}

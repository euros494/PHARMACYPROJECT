{% extends "base.html" %}
{% block title %}Register - Pharmacy Medicine Ordering System{% endblock %}
{% block content %}
<section class="section form-section">
    <h1>Customer Registration</h1>
    <p class="muted">Create an account to place sample orders. All fields are required.</p>
    <form method="post" action="{{ url_for('register') }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ full_name|default('') }}" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email|default('') }}" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" value="{{ phone|default('') }}" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">
        <small>At least 6 characters.</small>

        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" required>

        <button type="submit" class="btn">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a>.</p>
</section>
{% endblock %}

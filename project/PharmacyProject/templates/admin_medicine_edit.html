{% extends "base.html" %}
{% block title %}Edit Medicine - Admin{% endblock %}
{% block content %}
<section class="section form-section">
    <h1>Edit Medicine</h1>
    <p><a href="{{ url_for('admin_medicines') }}" class="btn btn-secondary btn-sm">Back to Medicines</a></p>
    <form method="post" action="{{ url_for('admin_medicine_edit', medicine_id=medicine.id) }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ medicine.name }}" required>
        <label for="price">Price ($)</label>
        <input type="number" id="price" name="price" step="0.01" min="0" value="{{ medicine.price }}" required>
        <label for="description">Description</label>
        <textarea id="description" name="description" rows="3" required>{{ medicine.description }}</textarea>
        <label for="available">Availability</label>
        <select id="available" name="available">
            <option value="1" {% if medicine.available %}selected{% endif %}>In Stock</option>
            <option value="0" {% if not medicine.available %}selected{% endif %}>Out of Stock</option>
        </select>
        <button type="submit" class="btn">Save Changes</button>
    </form>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Edit Staff - Admin{% endblock %}
{% block content %}
<section class="section form-section">
    <h1>Edit Staff Member</h1>
    <p><a href="{{ url_for('admin_staff') }}" class="btn btn-secondary btn-sm">Back to Staff</a></p>
    <form method="post" action="{{ url_for('admin_staff_edit', staff_id=member.id) }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ member.name }}" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ member.email }}" required>
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="phone" value="{{ member.phone }}" required>
        <label for="role">Job Role</label>
        <input type="text" id="role" name="role" value="{{ member.role }}" required>
        <button type="submit" class="btn">Save Changes</button>
    </form>
</section>
{% endblock %}
